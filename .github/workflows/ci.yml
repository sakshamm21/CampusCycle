name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: hosted-project
  cancel-in-progress: false

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run code quality checks
        run: pnpm check

  db:
    name: Database
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure environment
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          echo "$DEV_ENV_FILE" > .env
          grep '^NEXT_PUBLIC_' .env > apps/admin/.env.local || true
          mkdir -p supabase/.temp
          grep '^SUPABASE_PROJECT_REF=' .env | cut -d= -f2 | tr -d ' "\r\n' > supabase/.temp/project-ref

      - name: Run database tests
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          pnpm db:reset
          pnpm db:test

  e2e-admin:
    name: Admin E2E
    needs: db
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure environment
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          echo "$DEV_ENV_FILE" > .env
          grep '^NEXT_PUBLIC_' .env > apps/admin/.env.local || true
          mkdir -p supabase/.temp
          grep '^SUPABASE_PROJECT_REF=' .env | cut -d= -f2 | tr -d ' "\r\n' > supabase/.temp/project-ref

      - name: Deploy functions and reset database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          pnpm db:reset
          # Deploying needs the access token (08 P1-T20). Without it the functions already on the
          # project are used; the admin suite calls none of them.
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            pnpm functions:deploy || echo "::warning::Edge Function redeploy failed, the functions already on the dev project are used"
          else
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, Edge Functions were not redeployed"
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Admin Playwright tests
        run: pnpm e2e:admin

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
